name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable module tag to build and attest
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          head_commit=$(git rev-parse HEAD)
          [[ "$tag_commit" == "$head_commit" ]]
          git merge-base --is-ancestor "$tag_commit" origin/main
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            ext=
            if [[ "$os" == windows ]]; then ext=.exe; fi
            out="dist/sandboxes-gateway-${os}-${arch}${ext}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X github.com/rheic/sandboxes-gateway/internal/version.Version=$VERSION" \
              -o "$out" ./cmd/sandboxes-gateway
          done
          actual=$(dist/sandboxes-gateway-linux-amd64)
          [[ "$actual" == "sandboxes-gateway $VERSION" ]]
          (cd dist && sha256sum sandboxes-gateway-* > SHA256SUMS)
      - name: Install CycloneDX generator
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
      - name: Generate SBOM
        run: cyclonedx-gomod mod -json -licenses -type library -output dist/sandboxes-gateway.cdx.json .
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/sandboxes-gateway-*
          sbom-path: dist/sandboxes-gateway.cdx.json
      - name: Publish release assets without replacing existing files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          for asset in dist/*; do
            name=${asset##*/}
            digest=$(sha256sum "$asset" | cut -d ' ' -f 1)
            existing=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq ".assets[] | select(.name == \"$name\") | (.digest // \"UNKNOWN\")")
            if [[ -z "$existing" ]]; then
              gh release upload "$TAG" "$asset"
            elif [[ "$existing" == "sha256:$digest" ]]; then
              echo "Release asset already matches: $name"
            else
              echo "Refusing to replace conflicting or unverifiable release asset: $name" >&2
              exit 1
            fi
          done
